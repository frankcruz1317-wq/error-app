<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Códigos de Error de Máquinas</title>

  <style>
    :root{
      --bg: #0b1020;
      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --line: rgba(255,255,255,0.14);
      --ok: #38bdf8;
      --bad: #fb7185;
      --good: #34d399;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1100px 600px at 10% -10%, rgba(56,189,248,0.35), transparent 60%),
        radial-gradient(900px 520px at 90% 10%, rgba(52,211,153,0.25), transparent 60%),
        radial-gradient(900px 520px at 50% 110%, rgba(251,113,133,0.22), transparent 60%),
        linear-gradient(180deg, #050816, #0b1020 55%, #070a14);
      padding: 26px 16px 50px;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56,189,248,0.95), rgba(52,211,153,0.85));
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    h1{
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .sub{
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      max-width: 560px;
    }

    .pill{
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      height: fit-content;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px;
      margin-top: 14px;
    }

    @media (max-width: 860px){
      header{ flex-direction: column; align-items:flex-start; }
      .grid{ grid-template-columns: 1fr; }
      .pill{ width: 100%; }
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
